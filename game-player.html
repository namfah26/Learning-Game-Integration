<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เล่นเกม</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;font-family:'Kanit','Noto Sans Thai',Tahoma,Arial,sans-serif;background:#10131d;color:#fff}.player{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:linear-gradient(135deg,#5164d8,#7548b6);box-shadow:0 2px 12px rgba(0,0,0,.22);z-index:2}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}.sub{font-size:12px;opacity:.84;margin-top:2px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:9px 13px;background:rgba(255,255,255,.13);color:#fff;font:inherit;font-weight:800;cursor:pointer}.primary{background:rgba(24,44,122,.55)}.saved{display:none;padding:6px 10px;border-radius:999px;background:#e7f8ef;color:#176c4a;font-size:12px;font-weight:900}.frame{position:relative;min-height:0;background:#000}iframe{display:block;width:100%;height:100%;border:0;background:#000}.error{position:absolute;inset:0;display:none;place-items:center;background:#f6f7fb;color:#334155;padding:25px;text-align:center}.error>div{max-width:600px;background:#fff;border-radius:18px;padding:25px;box-shadow:0 16px 40px rgba(0,0,0,.14)}
@media(max-width:700px){.toolbar{align-items:flex-start}.title{max-width:36vw;font-size:14px}.sub{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions button{font-size:12px;padding:8px 9px}.saved{display:none!important}}
</style>
</head>
<body>
<main class="player">
  <header class="toolbar" id="playerToolbar">
    <div><div class="title" id="gameTitle">กำลังเปิดเกม...</div><div class="sub" id="playerSub"></div></div>
    <div class="actions"><span id="savedBadge" class="saved">✓ บันทึกผลแล้ว</span><button class="primary" id="fullscreenBtn">⛶ เต็มจอ</button><button id="exitBtn">🏠 ออกจากเกม</button></div>
  </header>
  <section class="frame">
    <iframe id="gameFrame" src="about:blank" title="เกมการเรียนรู้" allow="fullscreen; autoplay" allowfullscreen></iframe>
    <div class="error" id="errorPanel"><div><h2>ไม่สามารถเปิดเกมได้</h2><p id="errorText"></p><button style="background:#5b67d8" onclick="PlayerApp.exitGame()">กลับหน้ารวมเกม</button></div></div>
  </section>
</main>
<script src="./js/app-data.js"></script>
<script src="./js/backend-config.js"></script>
<script src="./js/sheets-api.js"></script>
<script src="./js/player.js"></script>
</body>
</html>
